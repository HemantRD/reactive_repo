    <!-- Step 1: reusable tooth shape (one rounded rectangle, pointing "up") -->
    <defs>
        <rect id="tooth" x="21" y="2" width="8" height="12"
              rx="2" fill="#000000" style="stroke: black;"
              stroke-width="0.45"/>
    </defs>

    <!-- Step 2: everything that spins goes inside this group -->
    <g id="gear">

        <!-- Step 3: the ring — one circle with a smaller circle cut out (evenodd hole) -->


        <!-- Step 4: stamp the tooth 8 times, rotating 45° more each time -->
        <use href="#tooth" transform="rotate(0   25 225)"/>
        <use href="#tooth" transform="rotate(45  25 25)"/>
        <use href="#tooth" transform="rotate(90  25 25)"/>
        <use href="#tooth" transform="rotate(135 25 25)"/>
        <use href="#tooth" transform="rotate(180 25 25)"/>
        <use href="#tooth" transform="rotate(225 25 25)"/>
        <use href="#tooth" transform="rotate(270 25 25)"/>
        <use href="#tooth" transform="rotate(315 25 25)"/>

        <!--        <circle cx="25" cy="25" r="15" fill="white"-->
        <!--                style="stroke: black;" stroke-width="0.45"/>-->
        <circle cx="25" cy="25" r="11" fill="white"
                style="stroke: black;" stroke-width="10"/>

