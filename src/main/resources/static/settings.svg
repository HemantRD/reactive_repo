<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512">

    <rect width="512" height="512" style="stroke: black;" fill="#FFFFFF"/>

    <!--    <svg width="50" height="50"-->
    <!--         xmlns="http://www.w3.org/2000/svg"-->
    <!--         xmlns:xlink="http://www.w3.org/1999/xlink">    -->

    <!-- Step 1: reusable tooth shape (one rounded rectangle, pointing "up") -->
    <defs>
        <rect id="tooth" x="226" y="10" width="60" height="130"
              rx="18" fill="#ffffff" style="stroke: black;"/>
    </defs>

    <!-- Step 2: everything that spins goes inside this group -->
    <g id="gear">

        <!-- Step 3: the ring — one circle with a smaller circle cut out (evenodd hole) -->


        <!-- Step 4: stamp the tooth 8 times, rotating 45° more each time -->
        <use href="#tooth" transform="rotate(0   256 256)"/>
        <use href="#tooth" transform="rotate(45  256 256)"/>
        <use href="#tooth" transform="rotate(90  256 256)"/>
        <use href="#tooth" transform="rotate(135 256 256)"/>
        <use href="#tooth" transform="rotate(180 256 256)"/>
        <use href="#tooth" transform="rotate(225 256 256)"/>
        <use href="#tooth" transform="rotate(270 256 256)"/>
        <use href="#tooth" transform="rotate(315 256 256)"/>

        <circle cx="256" cy="256" r="150" fill="white"
                style="stroke: black;" stroke-width="1"/>
        <circle cx="256" cy="256" r="65" fill="white"
                style="stroke: black;" stroke-width="1"/>

        <!--        fill="white"-->
        <!--        style="stroke: black;" stroke="#ffffff" stroke-width="85"-->


