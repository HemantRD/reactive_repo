<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Unrotated reference rectangle (gray) -->
    <rect x="60" y="60" width="80" height="60" fill="#ccc" />

    <!-- Rotated rectangle by 45 degrees around its center (100, 90) -->
    <rect x="60" y="60" width="80" height="60" fill="#ff5722"
          transform="rotate(, 100, 90)" />
</svg>